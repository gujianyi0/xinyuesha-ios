name: Verify iOS resource-manager candidate
on:
  push:
    branches: [candidate/20261127-40-ios-resource-manager]
permissions:
  contents: read
jobs:
  verify-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the shipped Qt version for UI regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 fonts-noto-cjk
          python -m pip install 'PySide6==6.8.3'
      - name: Real Qt touch and mouse resource-manager regression
        run: python scripts/test_resource_pack_client.py --payload runtime --output qml-resource-manager
      - name: Download actual public clients and verify every byte
        env:
          FILES_JSON: '[{"path":"xinyuesha/20261127-40-ios-resource-manager/ios.ipa","size":266119040,"sha256":"355888365943f444cf548edd569f72476389a2a08a5485c740406ae9167ff143","version":"20261127.40"},{"path":"xinyuesha/20261127-40-ios-resource-manager/SHA256SUMS.txt","size":307,"sha256":"d0bc878f1d9c3b53245f9f24cfcd6be1224dcb3d0f9277a8fcb34c754f936c62","version":"20261127.40"}]'
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const rows=JSON.parse(process.env.FILES_JSON);
          const results=await Promise.all(rows.map(async row=>{
            const url='https://preview.gujianyi-web-preview.pages.dev/download/'+row.path;
            const head=await fetch(url,{method:'HEAD',signal:AbortSignal.timeout(30000)});
            assert.equal(head.status,200);assert.equal(head.headers.get('x-client-version'),row.version);assert.equal(head.headers.get('x-checksum-sha256'),row.sha256);
            for(const range of ['bytes=0-15','bytes=-16']){
              const part=await fetch(url,{headers:{range},signal:AbortSignal.timeout(30000)});assert.equal(part.status,206);assert.equal((await part.arrayBuffer()).byteLength,16);
            }
            const response=await fetch(url,{signal:AbortSignal.timeout(180000)});assert.equal(response.status,200);
            const hash=createHash('sha256');let bytes=0;
            for await(const chunk of response.body){hash.update(chunk);bytes+=chunk.length;}
            assert.equal(bytes,row.size);assert.equal(hash.digest('hex'),row.sha256);
            const result={...row,bytes,headVerified:true,prefixAndSuffixRanges:true,fullPublicDownloadVerified:true};console.log(JSON.stringify(result));return result;
          }));
          await fs.writeFile('public-downloads-verified.json',JSON.stringify(results,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-resource-manager-20261127-40
          path: |
            public-downloads-verified.json
            qml-resource-manager/result.json
            qml-resource-manager/*.png
          if-no-files-found: warn
