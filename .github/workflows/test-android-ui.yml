name: Test client gameplay UI work
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/payload/**'
      - 'runtime/card-counter/**'
      - 'pc/payload/**'
      - 'android/tools/test_gameplay_work.py'
      - 'scripts/test_counter_catalogue.py'
      - 'scripts/test_deck_knowledge.py'
      - 'scripts/fixtures/known_card_tracker_0_5_25.lua'
      - 'scripts/test_social_session.py'
      - 'scripts/test_social_follow.py'
      - 'scripts/test_social_transport.py'
      - 'scripts/test_social_native_bridge.py'
      - 'scripts/test_touch_log.py'
      - 'scripts/test_role_voice.py'
      - 'scripts/test_interactions.py'
      - 'scripts/test_skin_settings.py'
      - '.github/workflows/test-android-ui.yml'
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            qt: '6.8.3'
            payload: android/payload
          - platform: iOS
            qt: '6.8.3'
            payload: runtime
          - platform: Windows
            qt: '6.10.0'
            payload: pc/payload
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libxkbcommon0 fonts-noto-cjk
      - run: python3 -m pip install 'PySide6==${{ matrix.qt }}'
      - run: python3 android/tools/test_gameplay_work.py --work-dir "$RUNNER_TEMP/client-gameplay" --payload '${{ matrix.payload }}' --platform '${{ matrix.platform }}' --cycles 60 --overview --result "$RUNNER_TEMP/client-gameplay/result.json"
      - run: |
          sudo apt-get install -y liblua5.4-0
          python3 scripts/test_counter_catalogue.py --payload '${{ matrix.payload }}' --work-dir "$RUNNER_TEMP/counter-catalogue" --lua-library liblua5.4.so.0 --result "$RUNNER_TEMP/counter-catalogue/result.json"
          python3 scripts/test_deck_knowledge.py --payload '${{ matrix.payload }}' --lua-library liblua5.4.so.0
      - run: python3 scripts/test_social_session.py --payload '${{ matrix.payload }}' --work-dir "$RUNNER_TEMP/social-session"
      - run: python3 scripts/test_social_follow.py --payload '${{ matrix.payload }}' --work-dir "$RUNNER_TEMP/social-follow"
      - run: python3 scripts/test_social_transport.py --payload '${{ matrix.payload }}' --work-dir "$RUNNER_TEMP/social-transport"
      - if: matrix.platform == 'iOS'
        run: python3 scripts/test_social_native_bridge.py --work-dir "$RUNNER_TEMP/social-native-bridge"
      - run: python3 scripts/test_touch_log.py --payload '${{ matrix.payload }}' --work-dir "$RUNNER_TEMP/touch-log"
      - run: python3 scripts/test_role_voice.py --payload '${{ matrix.payload }}' --work-dir "$RUNNER_TEMP/role-voice"
      - run: python3 scripts/test_interactions.py --payload '${{ matrix.payload }}' --work-dir "$RUNNER_TEMP/interactions"
      - run: python3 scripts/test_skin_settings.py --payload '${{ matrix.payload }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-gameplay-${{ matrix.platform }}
          path: ${{ runner.temp }}/client-gameplay/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counter-catalogue-${{ matrix.platform }}
          path: ${{ runner.temp }}/counter-catalogue/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interactions-${{ matrix.platform }}
          path: ${{ runner.temp }}/interactions/result.json
