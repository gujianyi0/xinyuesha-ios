name: Test Android gameplay UI work
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/payload/**'
      - 'android/tools/test_gameplay_work.py'
      - '.github/workflows/test-android-ui.yml'
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libxkbcommon0 fonts-noto-cjk
      - run: python3 -m pip install 'PySide6==6.8.3'
      - run: python3 android/tools/test_gameplay_work.py --work-dir "$RUNNER_TEMP/android-gameplay" --result "$RUNNER_TEMP/android-gameplay/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-gameplay-result
          path: ${{ runner.temp }}/android-gameplay/result.json
