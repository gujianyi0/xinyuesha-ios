# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds an UNSIGNED iOS .ipa on a GitHub-hosted macOS runner.
# Download the artifact and sign/install it with Sideloadly or AltStore.
#
# This file must live at <repo>/.github/workflows/build-ios.yml.
name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"

jobs:
  test-core-repair:
    name: Test core repository recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y qt6-base-dev libgit2-dev pkg-config
      - name: Verify seed and recovery against real Git repositories
        run: |
          python3 scripts/test_core_repository.py
          c++ -std=c++17 -fPIC scripts/test_ios_core_repair.cpp -Isrc \
            $(pkg-config --cflags --libs Qt6Core libgit2) -o "$RUNNER_TEMP/test-core-repair"
          "$RUNNER_TEMP/test-core-repair"
  build:
    name: Build iOS arm64
    needs: test-core-repair
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Rosetta 2 (Intel Qt host tools on arm64 runner)
        if: runner.arch == 'ARM64'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Install build tools
        run: |
          brew install cmake swig
          # GitHub's Homebrew Python is PEP 668 externally-managed, so install
          # aqt into a throw-away venv instead of the system interpreter.
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --upgrade pip aqtinstall
          echo "$RUNNER_TEMP/aqt-venv/bin" >> "$GITHUB_PATH"

      - name: Cache Qt and native dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Qt/6.8.3/ios
            ~/Qt/6.8.3/macos
            ios-deps
          key: fk-ios-deps-${{ runner.os }}-qt683-openssl351-git2-197-v1

      - name: Install Qt for iOS
        run: |
          if [ ! -x "$HOME/Qt/6.8.3/ios/bin/qt-cmake" ]; then
            aqt install-qt mac ios 6.8.3 ios \
              -m qtmultimedia qt5compat qtshadertools -O "$HOME/Qt"
          fi

      - name: Install host Qt (cross-compile tools)
        run: |
          if [ ! -x "$HOME/Qt/6.8.3/macos/bin/qmake" ]; then
            aqt install-qt mac desktop 6.8.3 clang_64 -m qtshadertools -O "$HOME/Qt"
          fi

      - name: Build Lua / OpenSSL / libgit2
        run: bash scripts/build_deps.sh --prefix "$PWD/ios-deps"

      - name: Build app and package unsigned IPA
        run: bash scripts/build_ios.sh --qt "$HOME/Qt/6.8.3/ios" --host-qt "$HOME/Qt/6.8.3/macos" --deps "$PWD/ios-deps"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xinyuesha-ios-unsigned
          path: build-ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
