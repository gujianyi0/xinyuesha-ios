# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds an UNSIGNED iOS .ipa on a GitHub-hosted macOS runner.
# Download the artifact and sign/install it with Sideloadly or AltStore.
#
# This file must live at <repo>/.github/workflows/build-ios.yml.
name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"

jobs:
  test-core-repair:
    name: Test core repository recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y qt6-base-dev libgit2-dev liblua5.4-dev pkg-config
      - name: Verify seed and recovery against real Git repositories
        run: |
          python3 scripts/test_core_repository.py
          python3 scripts/test_package_ipa.py
          c++ -std=c++17 -fPIC scripts/test_ios_core_repair.cpp -Isrc \
            $(pkg-config --cflags --libs Qt6Core libgit2) -o "$RUNNER_TEMP/test-core-repair"
          "$RUNNER_TEMP/test-core-repair"
          c++ -std=c++17 -fPIC scripts/test_ui_payload.cpp -Isrc \
            $(pkg-config --cflags --libs Qt6Core) -o "$RUNNER_TEMP/test-ui-payload"
          "$RUNNER_TEMP/test-ui-payload"
          c++ -std=c++17 -fPIC scripts/test_package_checksum.cpp -Isrc \
            $(pkg-config --cflags --libs Qt6Core) -o "$RUNNER_TEMP/test-package-checksum"
          "$RUNNER_TEMP/test-package-checksum" runtime/packages
          c++ -std=c++17 -fPIC scripts/test_local_file_url.cpp -Isrc \
            $(pkg-config --cflags --libs Qt6Core) -o "$RUNNER_TEMP/test-file-url"
          "$RUNNER_TEMP/test-file-url"
          c++ -std=c++17 -fPIC scripts/test_request_clock.cpp -Isrc \
            $(pkg-config --cflags --libs Qt6Core) -o "$RUNNER_TEMP/test-request-clock"
          "$RUNNER_TEMP/test-request-clock"
          c++ -std=c++17 -fPIC scripts/test_lua_variant.cpp -Isrc \
            $(pkg-config --cflags --libs Qt6Core lua5.4) -o "$RUNNER_TEMP/test-lua-variant"
          "$RUNNER_TEMP/test-lua-variant"
          c++ -std=c++17 -fPIC scripts/test_ios_ui_overlay.cpp -Isrc \
            $(pkg-config --cflags --libs Qt6Core Qt6Network) -o "$RUNNER_TEMP/test-ios-ui"
          "$RUNNER_TEMP/test-ios-ui" runtime "$RUNNER_TEMP/ios-ui"
      - name: Test QML layout and state changes on the shipped Qt version
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          FK_TEST_UI: ${{ runner.temp }}/ios-ui
        run: |
          sudo apt-get install -y libegl1 libxkbcommon0 fonts-noto-cjk
          python3 -m pip install 'PySide6==6.8.3'
          python3 scripts/test_ios_qml.py
          python3 scripts/test_ios_feedback_dialogs.py
          python3 scripts/test_ios_marks.py
      - name: Verify current server core UI without modifying the bundled core
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          FK_TEST_AUTH: '0'
          FK_TEST_UI: ${{ runner.temp }}/server-ui
        run: |
          git init "$RUNNER_TEMP/server-core"
          git -C "$RUNNER_TEMP/server-core" remote add origin https://cnb.cool/Qsgs-Fans/notify-ctrl/freekill-core
          git -C "$RUNNER_TEMP/server-core" fetch --depth=1 origin 5337ea1bbf4beabeee950e88329da3e8bd91eb09
          git -C "$RUNNER_TEMP/server-core" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/test-ios-ui" "$RUNNER_TEMP/server-core" "$RUNNER_TEMP/server-ui"
          python3 scripts/test_ios_qml.py
          python3 scripts/test_ios_feedback_dialogs.py
          python3 scripts/test_ios_marks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-test-fixture
          path: |
            ${{ runner.temp }}/ios-ui
            ${{ runner.temp }}/server-ui
  build:
    name: Build iOS arm64
    needs: test-core-repair
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Rosetta 2 (Intel Qt host tools on arm64 runner)
        if: runner.arch == 'ARM64'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Install build tools
        run: |
          brew install cmake swig
          # GitHub's Homebrew Python is PEP 668 externally-managed, so install
          # aqt into a throw-away venv instead of the system interpreter.
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --upgrade pip aqtinstall
          echo "$RUNNER_TEMP/aqt-venv/bin" >> "$GITHUB_PATH"

      - name: Cache Qt and native dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Qt/6.8.3/ios
            ~/Qt/6.8.3/macos
            ios-deps
          key: fk-ios-deps-${{ runner.os }}-qt683-openssl351-git2-197-v1

      - name: Install Qt for iOS
        run: |
          if [ ! -x "$HOME/Qt/6.8.3/ios/bin/qt-cmake" ]; then
            aqt install-qt mac ios 6.8.3 ios \
              -m qtmultimedia qt5compat qtshadertools -O "$HOME/Qt"
          fi

      - name: Install host Qt (cross-compile tools)
        run: |
          if [ ! -x "$HOME/Qt/6.8.3/macos/bin/qmake" ]; then
            aqt install-qt mac desktop 6.8.3 clang_64 -m qtshadertools -O "$HOME/Qt"
          fi

      - name: Test system friend transport on macOS Foundation
        run: |
          cmake -S scripts/ios-friend-native-test -B "$RUNNER_TEMP/native-friend-test" \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.8.3/macos" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/native-friend-test" --parallel 2
          "$RUNNER_TEMP/native-friend-test/test-ios-friends"

      - name: Build Lua / OpenSSL / libgit2
        run: |
          # This cache key pins Qt / OpenSSL / libgit2 versions. Reuse complete
          # arm64 dependencies rather than recompiling them on every app fix.
          ready=1
          for file in lib/liblua54.a lib/libcrypto.a lib/libssl.a lib/libgit2.a; do
            if [ ! -s "ios-deps/$file" ] || ! xcrun lipo -verify_arch arm64 "ios-deps/$file"; then
              ready=0
            fi
          done
          for file in include/lua/lua.h include/git2.h include/openssl/ssl.h; do
            [ -s "ios-deps/$file" ] || ready=0
          done
          if [ "$ready" = 1 ]; then
            echo "Using verified arm64 libraries from the versioned dependency cache."
          else
            bash scripts/build_deps.sh --prefix "$PWD/ios-deps"
          fi

      - name: Build app and package unsigned IPA
        run: bash scripts/build_ios.sh --qt "$HOME/Qt/6.8.3/ios" --host-qt "$HOME/Qt/6.8.3/macos" --deps "$PWD/ios-deps"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xinyuesha-ios-unsigned
          path: build-ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
